name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scanner-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find scanner -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Scanner smoke tests
        run: php scanner/tests/smoke.php
      - name: JavaScript syntax
        run: |
          node --check scanner/assets/register.js
          node --check scanner/assets/scanner.js
      - name: Runtime files are not committed
        run: |
          test ! -f scanner/config.php
          test ! -f scanner/data/marks.json
